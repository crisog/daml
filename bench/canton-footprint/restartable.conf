# A Canton network that keeps its state on disk: one synchronizer (one BFT
# sequencer and one mediator) and two participants. It is the configuration of
# the sandbox command with file storage in place of memory. The ordering layer
# has no storage setting of its own, so it uses the sequencer's storage.
#
# Start it with the daemon command and restartable-bootstrap.canton:
#   bin/canton daemon -c restartable.conf --bootstrap restartable-bootstrap.canton
#
# H2 file storage is for tests only (see config/storage/h2.conf in the release).
# WRITE_DELAY=0 makes H2 write each commit to disk before it returns. With the
# default delay of 500 ms, a kill can leave the sequencer behind its members.
# The files go to /work/data, which restart.sh mounts from the run directory.
include required(file("/canton/config/storage/h2.conf"))

canton {
  mediators.mediator1 {
    admin-api.port = 6869
    storage = ${_shared.storage}
    storage.config.url = "jdbc:h2:file:/work/data/mediator1;MODE=PostgreSQL;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1;WRITE_DELAY=0"
  }
  sequencers.sequencer1 {
    admin-api.port = 6868
    public-api.port = 6867
    sequencer {
      type = "BFT"
      config {}
    }
    storage = ${_shared.storage}
    storage.config.url = "jdbc:h2:file:/work/data/sequencer1;MODE=PostgreSQL;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1;WRITE_DELAY=0"
  }
  participants.sandbox {
    admin-api.port = 6866
    http-ledger-api {
      port = 6864
      address = "0.0.0.0"
    }
    ledger-api {
      port = 6865
      user-management-service.enabled = true
    }
    storage = ${_shared.storage}
    storage.config.url = "jdbc:h2:file:/work/data/sandbox;MODE=PostgreSQL;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1;WRITE_DELAY=0"
  }
  participants.pebblebox {
    admin-api.port = 7866
    http-ledger-api {
      port = 7864
      address = "0.0.0.0"
    }
    ledger-api {
      port = 7865
      user-management-service.enabled = true
    }
    storage = ${_shared.storage}
    storage.config.url = "jdbc:h2:file:/work/data/pebblebox;MODE=PostgreSQL;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1;WRITE_DELAY=0"
  }
}
