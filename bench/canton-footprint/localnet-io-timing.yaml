# A compose override for LocalNet: Postgres records the time of its writes and
# of its fsync calls (the view pg_stat_io). The first three arguments are the
# command of the release.
services:
  postgres:
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
