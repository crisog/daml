<g class="k5" opacity="0.00"><text x="60" y="52" font-size="17" font-weight="bold" letter-spacing="0.08em" text-anchor="start" fill="#B3B3B3">STEP 2 OF 3</text><text x="60" y="94" font-size="26" font-weight="normal" letter-spacing="0em" text-anchor="start" fill="#FFFFFF">The synchronizer orders the message and delivers it.</text></g>
<g class="k6" opacity="1.00"><text x="60" y="52" font-size="17" font-weight="bold" letter-spacing="0.08em" text-anchor="start" fill="#B3B3B3">STEP 3 OF 3</text><text x="60" y="94" font-size="26" font-weight="normal" letter-spacing="0em" text-anchor="start" fill="#FFFFFF">Bob's participant stores the same contract. Bob can act on it.</text></g>
<g class="k7" opacity="1.00"><rect x="390" y="590" width="420" height="56" fill="#0E1A1C" stroke="#FFFFFF" stroke-width="2"/><text x="600" y="626" font-size="20" font-weight="bold" letter-spacing="0.04em" text-anchor="middle" fill="#FFFFFF">ONE CONTRACT, TWO NODES</text></g>
