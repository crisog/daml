<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" fill="none" font-family="'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">One contract on two participants</title>
<desc id="figure-description">Three steps. Step 1: Alice creates a contract for Bob on participant 1, the node that hosts her. Step 2: participant 1 sends it through the synchronizer, which orders and delivers the message and cannot read it. Step 3: participant 2, the node that hosts Bob, stores the same contract. Verdict: one contract, two nodes.</desc>
