<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" fill="none" font-family="'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">A cold start of LocalNet and a start from a saved ledger</title>
<desc id="figure-description">Horizontal bars of the seconds from the start of LocalNet, the median of three starts of each kind on one boat.dev machine with 4 shared vCPUs. A cold start: ready after 213 seconds, and the first transfer passed after 251 seconds. A start from a saved ledger: ready after 93 seconds, and the first transfer passed after 104 seconds.</desc>
<rect width="1200" height="410" fill="#0E1A1C"/>
<g><text x="60" y="52" font-size="17" font-weight="bold" letter-spacing="0.08em" text-anchor="start" fill="#B3B3B3">MEDIAN OF THREE STARTS ON ONE BOAT.DEV MACHINE</text><text x="60" y="94" font-size="26" font-weight="normal" letter-spacing="0em" text-anchor="start" fill="#FFFFFF">Seconds from start to ready, and to the first transfer that passes.</text><path d="M556 140L556 350" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="556" y="378" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">60 s</text><path d="M712 140L712 350" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="712" y="378" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">120 s</text><path d="M868 140L868 350" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="868" y="378" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">180 s</text><path d="M1024 140L1024 350" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="1024" y="378" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">240 s</text><path d="M400 140L400 350" stroke="#556062" stroke-width="2"/><text x="60" y="171" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">COLD START · READY</text><rect x="400" y="150" width="553.8000000000001" height="30" fill="#B3B3B3" fill-opacity="0.7"/><text x="965.8000000000001" y="171" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">213 s</text><text x="60" y="217" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">COLD START · FIRST TRANSFER</text><rect x="400" y="196" width="652.6" height="30" fill="#B3B3B3" fill-opacity="0.7"/><text x="1064.6" y="217" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">251 s</text><text x="60" y="281" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#FFFFFF">SAVED LEDGER · READY</text><rect x="400" y="260" width="241.8" height="30" fill="#FFFFFF" fill-opacity="1"/><text x="653.8" y="281" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#FFFFFF">93 s</text><text x="60" y="327" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#FFFFFF">SAVED LEDGER · FIRST TRANSFER</text><rect x="400" y="306" width="270.40000000000003" height="30" fill="#FFFFFF" fill-opacity="1"/><text x="682.4000000000001" y="327" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#FFFFFF">104 s</text></g>
