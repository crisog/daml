<g class="k13" opacity="0.00"><text x="60" y="52" font-size="17" font-weight="bold" letter-spacing="0.08em" text-anchor="start" fill="#B3B3B3">CASE 1 OF 3</text><text x="60" y="94" font-size="26" font-weight="normal" letter-spacing="0em" text-anchor="start" fill="#FFFFFF">In a 2 GiB container the JVM picks the G1 collector.</text></g>
<g class="k14" opacity="1.00"><text x="60" y="52" font-size="17" font-weight="bold" letter-spacing="0.08em" text-anchor="start" fill="#B3B3B3">CASE 2 OF 3</text><text x="60" y="94" font-size="26" font-weight="normal" letter-spacing="0em" text-anchor="start" fill="#FFFFFF">Below 1,792 MiB the JVM selects Serial, with a fixed old generation.</text></g>
