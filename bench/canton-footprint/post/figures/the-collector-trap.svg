<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" fill="none" font-family="'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">A small container changes the collector, and the collector changes the heap</title>
<desc id="figure-description">Three cases with one 256 MiB heap and 217 MiB of live data. Case 1: in a 2 GiB container the JVM picks the G1 collector. The old generation can grow to the whole heap, the live data fits, the heap guard of Canton passes, and the command of Alice is accepted. Case 2: in a 1.5 GiB container the JVM picks the Serial collector, which gives the old generation a fixed 171 MiB. The old generation is full after every collection, the guard trips, and the command is rejected with HTTP 409 HEAP_MEMORY_OVER_LIMIT. Case 3: the same 1.5 GiB container with -XX:+UseG1GC. The fixed split is gone and the command is accepted.</desc>
