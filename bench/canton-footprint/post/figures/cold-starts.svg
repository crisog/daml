<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="346" viewBox="0 0 1200 346" fill="none" font-family="'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">The cold start of each network on a boat.dev machine</title>
<desc id="figure-description">Horizontal bars of the seconds from start to ready, the median of six cold starts on a boat.dev machine with 4 shared vCPUs. The sandbox with one participant: 31 seconds. The sandbox with three participants: 38 seconds. LocalNet: 329 seconds.</desc>
<rect width="1200" height="346" fill="#0E1A1C"/>
<g><text x="60" y="52" font-size="17" font-weight="bold" letter-spacing="0.08em" text-anchor="start" fill="#B3B3B3">MEDIAN OF SIX COLD STARTS</text><text x="60" y="94" font-size="26" font-weight="normal" letter-spacing="0em" text-anchor="start" fill="#FFFFFF">Seconds from start to ready on a boat.dev machine with 4 vCPUs.</text><path d="M460 140L460 286" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="460" y="314" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">60 s</text><path d="M580 140L580 286" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="580" y="314" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">120 s</text><path d="M700 140L700 286" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="700" y="314" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">180 s</text><path d="M820 140L820 286" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="820" y="314" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">240 s</text><path d="M940 140L940 286" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="940" y="314" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">300 s</text><path d="M1060 140L1060 286" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="1060" y="314" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">360 s</text><path d="M340 140L340 286" stroke="#556062" stroke-width="2"/><text x="60" y="171" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#FFFFFF">SANDBOX · 1 PARTICIPANT</text><rect x="340" y="150" width="62" height="30" fill="#B3B3B3" fill-opacity="0.7"/><text x="414" y="171" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#FFFFFF">31 s</text><text x="60" y="217" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#FFFFFF">SANDBOX · 3 PARTICIPANTS</text><rect x="340" y="196" width="76" height="30" fill="#B3B3B3" fill-opacity="0.7"/><text x="428" y="217" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#FFFFFF">38 s</text><text x="60" y="263" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#FFFFFF">LOCALNET</text><rect x="340" y="242" width="658" height="30" fill="#B3B3B3" fill-opacity="0.7"/><text x="1010" y="263" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#FFFFFF">329 s</text></g>
