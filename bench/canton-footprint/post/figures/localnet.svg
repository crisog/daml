<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" fill="none" font-family="'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">What LocalNet runs</title>
<desc id="figure-description">LocalNet runs the same Canton JVM as the sandbox, with three participants named app-user, app-provider and sv, and the global synchronizer. A second synchronizer is in the multi-sync profile. LocalNet adds a second JVM for the Splice apps, a Postgres server with 15 databases, and eight more containers for seven web UIs and nginx. Readout: 11 containers, 2 JVMs, 1 Postgres server.</desc>
<rect width="1200" height="680" fill="#0E1A1C"/>
