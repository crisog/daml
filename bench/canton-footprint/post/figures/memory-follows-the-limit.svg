.k1{animation:k1 13s ease-in-out infinite}
@keyframes k2{0%{opacity:1} 59.231%{opacity:1} 63.077%{opacity:0.22} 96.154%{opacity:0.22} 100.000%{opacity:1} 100%{opacity:1}}
