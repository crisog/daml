<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" fill="none" font-family="'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">LocalNet's Canton container holds what its limit allows</title>
<desc id="figure-description">Two cases on one memory scale from 0 to 12 GiB. Case 1: with the limits LocalNet ships, a 4 GiB container limit, the idle Canton container holds 2.6 GiB, and 0.5 GiB of that is live data after a forced full collection. Case 2: with the limits removed on a 125 GiB machine, the same idle container holds 10.5 GiB, far past the old limit, and its live data is 0.4 GiB. Verdict: memory held follows the limit, not the data.</desc>
