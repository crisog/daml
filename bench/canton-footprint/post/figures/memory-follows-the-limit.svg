<g class="k2" opacity="0.22"><path d="M524 224L524 352" stroke="#FFD66E" stroke-width="2" stroke-dasharray="8 6"/><text x="534" y="234" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#FFD66E">LIMIT 4 GiB</text></g>
<g class="k3" opacity="0.00"><rect x="226" y="256" width="33.52" height="78" fill="#0E1A1C"/><rect x="226" y="256" width="33.52" height="78" fill="#40FB50" fill-opacity="0.3" stroke="#40FB50" stroke-width="2"/><path d="M244 340L244 392" stroke="#40FB50" stroke-width="2"/><text x="226" y="412" font-size="16" font-weight="bold" letter-spacing="0.06em" text-anchor="start" fill="#40FB50">0.5 GiB IS LIVE DATA AFTER A FULL COLLECTION</text></g>
<g class="k4" opacity="1.00"><rect x="226" y="256" width="26.68" height="78" fill="#0E1A1C"/><rect x="226" y="256" width="26.68" height="78" fill="#40FB50" fill-opacity="0.3" stroke="#40FB50" stroke-width="2"/><path d="M244 340L244 392" stroke="#40FB50" stroke-width="2"/><text x="226" y="412" font-size="16" font-weight="bold" letter-spacing="0.06em" text-anchor="start" fill="#40FB50">0.4 GiB IS LIVE DATA AFTER A FULL COLLECTION</text></g>
<g class="k5" opacity="0.00"><text x="60" y="52" font-size="17" font-weight="bold" letter-spacing="0.08em" text-anchor="start" fill="#B3B3B3">CASE 1 OF 2</text><text x="60" y="94" font-size="26" font-weight="normal" letter-spacing="0em" text-anchor="start" fill="#FFFFFF">With LocalNet's limits, the idle Canton container holds 2.6 GiB.</text></g>
<g class="k6" opacity="1.00"><text x="60" y="52" font-size="17" font-weight="bold" letter-spacing="0.08em" text-anchor="start" fill="#B3B3B3">CASE 2 OF 2</text><text x="60" y="94" font-size="26" font-weight="normal" letter-spacing="0em" text-anchor="start" fill="#FFFFFF">Remove the limits and the same idle container holds 10.5 GiB.</text></g>
<g class="k7" opacity="1.00"><rect x="250" y="510" width="700" height="56" fill="#0E1A1C" stroke="#FFFFFF" stroke-width="2"/><text x="600" y="546" font-size="20" font-weight="bold" letter-spacing="0.04em" text-anchor="middle" fill="#FFFFFF">MEMORY HELD FOLLOWS THE LIMIT, NOT THE DATA</text></g>
</svg>
