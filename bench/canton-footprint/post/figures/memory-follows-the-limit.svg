<g><rect x="220" y="250" width="197.6" height="90" fill="#0E1A1C"/><rect x="220" y="250" width="197.6" height="90" fill="#556062" fill-opacity="0.5" stroke="#FFFFFF" stroke-width="2"/></g>
<g class="k0" opacity="0.00"><text x="220" y="234" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#FFFFFF">HOLDS 2.6 GiB</text></g>
