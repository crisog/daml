@keyframes k3{0%{opacity:1} 73.846%{opacity:1} 77.692%{opacity:0} 96.154%{opacity:0} 100.000%{opacity:1} 100%{opacity:1}}
.k3{animation:k3 13s ease-in-out infinite}
@keyframes k4{0%{opacity:0} 73.846%{opacity:0} 77.692%{opacity:1} 96.154%{opacity:1} 100.000%{opacity:0} 100%{opacity:0}}
.k4{animation:k4 13s ease-in-out infinite}
@keyframes k5{0%{opacity:1} 46.154%{opacity:1} 50.000%{opacity:0} 96.154%{opacity:0} 100.000%{opacity:1} 100%{opacity:1}}
.k5{animation:k5 13s ease-in-out infinite}
@keyframes k6{0%{opacity:0} 46.154%{opacity:0} 50.000%{opacity:1} 96.154%{opacity:1} 100.000%{opacity:0} 100%{opacity:0}}
.k6{animation:k6 13s ease-in-out infinite}
@keyframes k7{0%{opacity:0} 78.462%{opacity:0} 82.308%{opacity:1} 96.154%{opacity:1} 100.000%{opacity:0} 100%{opacity:0}}
.k7{animation:k7 13s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}.tr{display:none}}
</style>
