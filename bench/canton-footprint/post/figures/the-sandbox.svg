<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" fill="none" font-family="'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">What the sandbox runs</title>
<desc id="figure-description">The sandbox with --multi-sync is one Canton JVM. It runs three participants, named sandbox, pebblebox and sidebox, and two synchronizers, named synchronizer-1 and synchronizer-2. Alice is on the first participant and Bob is on the second. Readout: 1 process, 3 participants, 2 synchronizers.</desc>
<rect width="1200" height="680" fill="#0E1A1C"/>
<g><text x="60" y="52" font-size="17" font-weight="bold" letter-spacing="0.08em" text-anchor="start" fill="#B3B3B3">THE SANDBOX WITH THREE PARTICIPANTS</text><text x="60" y="94" font-size="26" font-weight="normal" letter-spacing="0em" text-anchor="start" fill="#FFFFFF">The sandbox is Canton only: participants and synchronizers.</text><rect x="185" y="150" width="830" height="356" stroke="#414D4F" stroke-width="2" stroke-dasharray="8 8"/><text x="205" y="176" font-size="16" font-weight="normal" letter-spacing="0.08em" text-anchor="start" fill="#B3B3B3">CANTON · ONE JVM</text><rect x="353" y="190" width="210" height="84" fill="#0E1A1C" stroke="#FFFFFF" stroke-width="2"/><rect x="361" y="198" width="194" height="68" stroke="#414D4F" stroke-width="2" stroke-dasharray="8 8"/><text x="458" y="228" font-size="18" font-weight="bold" letter-spacing="0.04em" text-anchor="middle" fill="#FFFFFF">SYNCHRONIZER 1</text><text x="458" y="252" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">synchronizer-1</text><rect x="638" y="190" width="210" height="84" fill="#0E1A1C" stroke="#FFFFFF" stroke-width="2"/><rect x="646" y="198" width="194" height="68" stroke="#414D4F" stroke-width="2" stroke-dasharray="8 8"/><text x="743" y="228" font-size="18" font-weight="bold" letter-spacing="0.04em" text-anchor="middle" fill="#FFFFFF">SYNCHRONIZER 2</text><text x="743" y="252" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">synchronizer-2</text><rect x="210" y="380" width="210" height="96" fill="#0E1A1C" stroke="#FFFFFF" stroke-width="2"/><rect x="218" y="388" width="194" height="80" stroke="#414D4F" stroke-width="2" stroke-dasharray="8 8"/><text x="315" y="418" font-size="18" font-weight="bold" letter-spacing="0.04em" text-anchor="middle" fill="#FFFFFF">PARTICIPANT 1</text><text x="315" y="442" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">sandbox · Alice</text><rect x="495" y="380" width="210" height="96" fill="#0E1A1C" stroke="#FFFFFF" stroke-width="2"/><rect x="503" y="388" width="194" height="80" stroke="#414D4F" stroke-width="2" stroke-dasharray="8 8"/><text x="600" y="418" font-size="18" font-weight="bold" letter-spacing="0.04em" text-anchor="middle" fill="#FFFFFF">PARTICIPANT 2</text><text x="600" y="442" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">pebblebox · Bob</text><rect x="780" y="380" width="210" height="96" fill="#0E1A1C" stroke="#FFFFFF" stroke-width="2"/><rect x="788" y="388" width="194" height="80" stroke="#414D4F" stroke-width="2" stroke-dasharray="8 8"/><text x="885" y="418" font-size="18" font-weight="bold" letter-spacing="0.04em" text-anchor="middle" fill="#FFFFFF">PARTICIPANT 3</text><text x="885" y="442" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">sidebox</text><rect x="280" y="590" width="640" height="56" fill="#0E1A1C" stroke="#FFFFFF" stroke-width="2"/><text x="600" y="626" font-size="20" font-weight="bold" letter-spacing="0.04em" text-anchor="middle" fill="#FFFFFF">1 PROCESS · 3 PARTICIPANTS · 2 SYNCHRONIZERS</text></g>
