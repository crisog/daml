<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="554" viewBox="0 0 1200 554" fill="none" font-family="'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">The stages of one LocalNet start</title>
<desc id="figure-description">A timeline of the nine stages of a LocalNet start on a boat.dev machine with 4 shared vCPUs, with the median of six starts for each stage. postgres starts: 11 seconds, canton starts: 31 seconds, the splice apps start: 44 seconds, splice decodes its packages: 81 seconds, splice creates the synchronizer: 27 seconds, splice uploads the packages: 31 seconds, splice creates the network rules: 25 seconds, the validators join: 52 seconds, docker waits for a health probe: 12 seconds. The stages sum to 314 seconds.</desc>
<rect width="1200" height="554" fill="#0E1A1C"/>
<g><text x="60" y="52" font-size="17" font-weight="bold" letter-spacing="0.08em" text-anchor="start" fill="#B3B3B3">ONE LOCALNET START ON BOAT.DEV · MEDIAN OF SIX</text><text x="60" y="94" font-size="26" font-weight="normal" letter-spacing="0em" text-anchor="start" fill="#FFFFFF">A LocalNet start has nine stages. The longest decodes packages.</text><path d="M590 140L590 494" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="590" y="522" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">60 s</text><path d="M710 140L710 494" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="710" y="522" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">120 s</text><path d="M830 140L830 494" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="830" y="522" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">180 s</text><path d="M950 140L950 494" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="950" y="522" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">240 s</text><path d="M1070 140L1070 494" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="1070" y="522" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">300 s</text><path d="M470 140L470 494" stroke="#556062" stroke-width="2"/><text x="60" y="169" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">POSTGRES STARTS</text><rect x="470" y="150" width="22" height="26" fill="#B3B3B3" fill-opacity="0.7"/><text x="504" y="169" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">11 s</text><text x="60" y="207" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">CANTON STARTS</text><rect x="492" y="188" width="62" height="26" fill="#B3B3B3" fill-opacity="0.7"/><text x="566" y="207" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">31 s</text><text x="60" y="245" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">THE SPLICE APPS START</text><rect x="554" y="226" width="88" height="26" fill="#B3B3B3" fill-opacity="0.7"/><text x="654" y="245" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">44 s</text><text x="60" y="283" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#FFFFFF">SPLICE DECODES ITS PACKAGES</text><rect x="642" y="264" width="162" height="26" fill="#FFFFFF" fill-opacity="1"/><text x="816" y="283" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#FFFFFF">81 s</text><text x="60" y="321" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">SPLICE CREATES THE SYNCHRONIZER</text><rect x="804" y="302" width="54" height="26" fill="#B3B3B3" fill-opacity="0.7"/><text x="870" y="321" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">27 s</text><text x="60" y="359" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">SPLICE UPLOADS THE PACKAGES</text><rect x="858" y="340" width="62" height="26" fill="#B3B3B3" fill-opacity="0.7"/><text x="932" y="359" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">31 s</text><text x="60" y="397" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">SPLICE CREATES THE NETWORK RULES</text><rect x="920" y="378" width="50" height="26" fill="#B3B3B3" fill-opacity="0.7"/><text x="982" y="397" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">25 s</text><text x="60" y="435" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">THE VALIDATORS JOIN</text><rect x="970" y="416" width="104" height="26" fill="#B3B3B3" fill-opacity="0.7"/><text x="1086" y="435" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">52 s</text><text x="60" y="473" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">DOCKER WAITS FOR A HEALTH PROBE</text><rect x="1074" y="454" width="24" height="26" fill="#B3B3B3" fill-opacity="0.7"/><text x="1110" y="473" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">12 s</text></g>
</svg>
