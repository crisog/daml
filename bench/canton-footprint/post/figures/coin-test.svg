<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="392" viewBox="0 0 1200 392" fill="none" font-family="'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">A Canton Coin test on four networks</title>
<desc id="figure-description">Horizontal bars of the seconds from nothing to a Canton Coin test that passed, the median of three runs on one boat.dev machine with 4 shared vCPUs. No network, Splice's own transfer tests: 30 seconds. The sandbox with Splice's packages and no Splice app, five transfers between two participants: 45 seconds. LocalNet with two validators and no web UI, five transfers: 137 seconds. LocalNet as shipped, five transfers: 161 seconds.</desc>
<rect width="1200" height="392" fill="#0E1A1C"/>
<g><text x="60" y="52" font-size="17" font-weight="bold" letter-spacing="0.08em" text-anchor="start" fill="#B3B3B3">ONE BOAT.DEV MACHINE · MEDIAN OF THREE RUNS</text><text x="60" y="94" font-size="26" font-weight="normal" letter-spacing="0em" text-anchor="start" fill="#FFFFFF">Seconds from nothing to a Canton Coin test that passed.</text><path d="M575 140L575 332" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="575" y="360" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">30 s</text><path d="M680 140L680 332" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="680" y="360" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">60 s</text><path d="M785 140L785 332" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="785" y="360" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">90 s</text><path d="M890 140L890 332" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="890" y="360" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">120 s</text><path d="M995 140L995 332" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="995" y="360" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">150 s</text><path d="M1100 140L1100 332" stroke="#414D4F" stroke-width="1" stroke-dasharray="2 6"/><text x="1100" y="360" font-size="16" font-weight="normal" letter-spacing="0em" text-anchor="middle" fill="#B3B3B3">180 s</text><path d="M470 140L470 332" stroke="#556062" stroke-width="2"/><text x="60" y="171" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">NO NETWORK · SPLICE'S OWN TESTS</text><rect x="470" y="150" width="105" height="30" fill="#B3B3B3" fill-opacity="0.7"/><text x="587" y="171" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">30 s</text><text x="60" y="217" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#FFFFFF">SANDBOX · SPLICE'S PACKAGES, NO APP</text><rect x="470" y="196" width="157.5" height="30" fill="#FFFFFF" fill-opacity="1"/><text x="639.5" y="217" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#FFFFFF">45 s</text><text x="60" y="263" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">LOCALNET · TWO VALIDATORS, NO WEB UI</text><rect x="470" y="242" width="479.5" height="30" fill="#B3B3B3" fill-opacity="0.7"/><text x="961.5" y="263" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">137 s</text><text x="60" y="309" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">LOCALNET AS SHIPPED</text><rect x="470" y="288" width="563.5" height="30" fill="#B3B3B3" fill-opacity="0.7"/><text x="1045.5" y="309" font-size="16" font-weight="bold" letter-spacing="0.04em" text-anchor="start" fill="#B3B3B3">161 s</text></g>
